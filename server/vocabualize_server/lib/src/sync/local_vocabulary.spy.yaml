class: LocalVocabulary
table: vocabulary
database: sync
fields:
  imageKind: String
  customImageId: String?
  customImageUploadedAt: DateTime?
  stockImageId: String?
  stockImageUrl: String?
  stockImageThumbUrl: String?
  stockPhotographer: String?
  stockPhotographerUrl: String?
  createdAt: DateTime
  extras: String?
  translations: List<LocalTranslation>?, relation(name=vocabulary_translations)
  progress: List<LocalProgress>?, relation(name=vocabulary_progress)
indexes:
  vocabulary_created_at_idx:
    fields: createdAt
