version: 1

client:
  minSupportedBuild: 13
  maintenanceMode: false
  maintenanceMessage: null

images:
  provider: garage
  bucket: vocabualize-images
  region: garage
  endpoint: http://garage:3900
  publicEndpoint: https://vocabualize-files.timdavidfriedrich.de

ai:
  enabled: true
  translationProvider: deepl
  stockImageProvider: pexels
  imageLabelingProvider: gemini
  imageLabelingModel: gemini-3.5-flash-lite
  translationsPerDay: 100
  stockSearchesPerDay: 100
  imageLabelingsPerDay: 30
  maxTextLength: 100
  maxLabelingImageBytes: 150000
  englishTarget: EN-US
