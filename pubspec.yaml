name: vocabualize
description: Vocabualize
publish_to: 'none'
version: 1.0.0+14

environment:
  sdk: ^3.13.5

workspace:
  - packages/vocabualize_client
  - packages/core
  - packages/shared
  - packages/feature_home
  - packages/feature_welcome
  - packages/feature_details
  - packages/feature_practice
  - packages/feature_collections
  - packages/feature_scan
  - packages/feature_settings
  - packages/feature_report
  - packages/feature_gate

dependencies:
  flutter:
    sdk: flutter

  core:
  shared:
  feature_home:
  feature_welcome:
  feature_details:
  feature_practice:
  feature_collections:
  feature_scan:
  feature_settings:
  feature_report:
  feature_gate:
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  injectable: ^3.0.0
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  klog:
    git:
      url: https://github.com/timdavidfriedrich/klog.git
      ref: v1.0.0
  kaisel: ^1.1.0

dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3

flutter:
  uses-material-design: true
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
