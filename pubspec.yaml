name: vocabualize
description: Vocabualize
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

workspace:
  - packages/core
  - packages/shared
  - packages/feature_home
  - packages/feature_welcome

dependencies:
  flutter:
    sdk: flutter

  core:
  shared:
  feature_home:
  feature_welcome:
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  go_router: ^18.1.1
  injectable: ^3.0.0
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  klog:
    git:
      url: https://github.com/timdavidfriedrich/klog.git
      ref: v1.0.0

dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3

flutter:
  uses-material-design: true
