resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  adaptive_actions:
    git:
      url: https://github.com/timdavidfriedrich/adaptive_actions.git
      ref: v1.0.0
  flutter_localizations:
    sdk: flutter
  core:
  intl:
  injectable:
  dart_mappable:
  kaisel:
  klog:
