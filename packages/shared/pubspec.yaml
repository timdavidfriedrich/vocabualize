      url: https://github.com/timdavidfriedrich/klog.git
      ref: v1.0.0
  vocabualize_client:
  serverpod_flutter: 4.1.0-beta.3
  serverpod_auth_idp_flutter: 4.1.0-beta.3
  path_provider: ^2.1.6
  serverpod_offline_sync_client: 0.0.11
  serverpod_database: 4.1.0-beta.3
  flutter_bloc:
  flutter_hooks:
  flutter_image_compress: ^2.5.1
  image_picker: ^1.2.4
  dio:
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  archive: ^4.5.2
  file_picker: ^13.2.0
  share_plus: ^13.3.1
  app_settings: ^9.0.1
  connectivity_plus: ^7.3.2
  flutter_tts: ^4.2.5
  diacritic: ^0.1.6
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
