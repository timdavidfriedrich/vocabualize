name: promote to production

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode of the internal-track build to promote"
        required: true
        type: string

jobs:
  promote:
    name: Promote internal build to production
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Write Play Store service account key
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: printf '%s' "$GOOGLE_PLAY_JSON_KEY" > fastlane/play-store-key.json
      - name: Promote to production
        env:
          VERSION_CODE: ${{ inputs.version_code }}
        run: bundle exec fastlane promote_production
